---
- name: Create directory for Docker reference files
  file:
    path: "/home/{{ user }}/docker-reference"
    state: directory
    mode: '0755'
  tags: [docker, reference]

- name: Copy backend Dockerfile
  copy:
    src: "{{ playbook_dir }}/../backend/Dockerfile"
    dest: "/home/{{ user }}/docker-reference/backend-Dockerfile"
    mode: '0644'
  tags: [docker, reference, backend]

- name: Copy frontend Dockerfile
  copy:
    src: "{{ playbook_dir }}/../client/Dockerfile"
    dest: "/home/{{ user }}/docker-reference/frontend-Dockerfile"
    mode: '0644'
  tags: [docker, reference, frontend]

- name: Copy frontend nginx config
  copy:
    src: "{{ playbook_dir }}/../client/nginx.conf"
    dest: "/home/{{ user }}/docker-reference/nginx.conf"
    mode: '0644'
  tags: [docker, reference, frontend, nginx]

- name: Create README for Docker reference files
  copy:
    dest: "/home/{{ user }}/docker-reference/README.md"
    content: |
      # Docker Reference Files
      
      This directory contains reference Docker configuration files used in the YOLO application deployment.
      
      ## Files
      
      - `backend-Dockerfile`: Dockerfile for the Node.js backend service
      - `frontend-Dockerfile`: Dockerfile for the React frontend
      - `nginx.conf`: Nginx configuration for the frontend container
      
      These files are for reference only and were automatically generated by the Ansible deployment.
    mode: '0644'
  tags: [docker, reference, docs]
