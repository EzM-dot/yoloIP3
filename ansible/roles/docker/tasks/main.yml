---
- name: Log in to Docker Hub
  docker_login:
    username: "{{ docker_username }}"
    password: "{{ docker_password }}"
    email: "{{ docker_email | default(omit) }}"
  when: docker_push | default(false) | bool
  no_log: true
  tags: [docker, auth]

- name: Build and push backend image
  docker_image:
    name: "{{ docker_username }}/{{ backend_image }}"
    build:
      path: "{{ app_dir }}/backend"
      dockerfile: Dockerfile
    source: build
    push: "{{ docker_push | default(false) | bool }}"
    force_source: "{{ docker_force_build | default(false) | bool }}"
    tag: "{{ docker_tag | default('latest') }}"
  tags: [docker, backend]

- name: Build and push frontend image
  docker_image:
    name: "{{ docker_username }}/{{ frontend_image }}"
    build:
      path: "{{ app_dir }}/frontend"
      dockerfile: Dockerfile
    source: build
    push: "{{ docker_push | default(false) | bool }}"
    force_source: "{{ docker_force_build | default(false) | bool }}"
    tag: "{{ docker_tag | default('latest') }}"
  tags: [docker, frontend]

- name: Update docker-compose.yml with new image tags
  template:
    src: docker-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: '0644'
  when: docker_push | default(false) | bool
  tags: [docker, config]
