---
- name: Setup YOLO Application in Vagrant
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - group_vars/all.yml
    - group_vars/{{ env }}.yml

  tasks:
    - name: Install Git
      apt:
        name: git
        state: present
        update_cache: yes
      tags: [setup, git]

    - name: Clone repository
      git:
        repo: "{{ github_repo }}"
        dest: "{{ app_dir }}"
        version: "{{ github_branch | default('main') }}"
      tags: [setup, git]

    - name: Install Docker
      include_role:
        name: geerlingguy.docker
      vars:
        docker_users: ["{{ ansible_user | default('vagrant') }}"]
      tags: [setup, docker]

    - name: Install Docker Compose
      get_url:
        url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-Linux-x86_64"
        dest: /usr/local/bin/docker-compose
        mode: '0755'
      tags: [setup, docker]

    - name: Add user to docker group
      user:
        name: "{{ ansible_user | default('vagrant') }}"
        groups: docker
        append: yes
      tags: [setup, docker]

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ ansible_user | default('vagrant') }}"
        group: "{{ ansible_user | default('vagrant') }}"
        mode: '0755'
      tags: [setup, directories]

    - name: Include deployment tasks
      include_tasks: deploy.yml
      tags: [deploy]
