---
# Common variables
ansible_python_interpreter: /usr/bin/python3

# Application settings
app_name: "ecommerce-platform"
app_version: "1.0.0"

# Database configuration
db_name: "ecommerce"
db_user: "ecommerce"
db_password: "ChangeThisPassword123!"  # Change this in production

# Redis configuration
redis_password: "ChangeThisRedisPassword123!"  # Change this in production

# Django secret key (generate with: openssl rand -base64 32)
secret_key: "django-insecure-change-this-to-a-secure-secret-key"

# Domain configuration
domain_name: "example.com"  # Change this to your domain

# SSL configuration
ssl_email: "admin@example.com"  # For Let's Encrypt

# Frontend configuration
frontend_port: 3003  # Changed to 3003 to avoid potential conflicts

# Backend configuration
backend_port: 8000  # Standard port for Django/Node.js

# Nginx configuration
nginx_user: "www-data"
nginx_worker_processes: "auto"
nginx_worker_connections: "1024"

# Docker configuration
docker_compose_version: "1.29.2"

docker_images:
  - name: "postgres"
    tag: "13"
  - name: "redis"
    tag: "6"
  - name: "nginx"
    tag: "1.21"
  - name: "node"
    tag: "16"

# System configuration
system_timezone: "UTC"
system_locale: "en_US.UTF-8"

# Security settings
ssh_port: 22
fail2ban_enabled: true
ufw_enabled: true

# Monitoring settings
monitoring_enabled: true
monitoring_port: 3001  # Grafana (changed from 3000 to avoid conflict with frontend)

# Backup settings
backup_enabled: true
backup_retention_days: 7

# Email settings
email_host: "smtp.example.com"
email_port: 587
email_username: "musyokaedwin@gmail.com"
email_password: "ChangeThisEmailPassword123!" #add my email, password, really !! To re-review
email_use_tls: true

# Stripe settings (for payments)
stripe_public_key: "pk_test_your_stripe_public_key"
stripe_secret_key: "sk_test_your_stripe_secret_key"

# Auth0 settings (for authentication)
auth0_domain: "your-tenant.auth0.com"
auth0_client_id: "your-auth0-client-id"
auth0_client_secret: "your-auth0-client-secret"
auth0_callback_url: "https://{{ domain_name }}/api/auth/callback"

# Feature flags
enable_analytics: false
enable_caching: true
enable_cdn: false

# Performance settings
worker_processes: 4
worker_threads: 2

# Logging settings
log_level: "INFO"
log_retention_days: 30
