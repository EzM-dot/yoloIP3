---
# Common system setup tasks
- name: Update apt package index
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install required system packages
  apt:
    name:
      - curl
      - git
      - python3-pip
      - python3-venv
      - software-properties-common
      - apt-transport-https
      - ca-certificates
      - gnupg-agent
    state: present

- name: Set timezone
  timezone:
    name: UTC

- name: Configure hostname
  hostname:
    name: "ecommerce-app-{{ inventory_hostname_short }}"

- name: Ensure required directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/ecommerce
    - /opt/ecommerce/logs
    - /opt/ecommerce/config
