---
- name: Create Nginx configuration directory
  file:
    path: /opt/ecommerce/nginx
    state: directory
    mode: '0755'

- name: Create Nginx configuration
  template:
    src: nginx.conf.j2
    dest: /opt/ecommerce/nginx/nginx.conf

- name: Create Nginx Dockerfile
  copy:
    content: |
      FROM nginx:1.21
      COPY nginx.conf /etc/nginx/conf.d/default.conf
      COPY ssl/ /etc/nginx/ssl/
    dest: /opt/ecommerce/nginx/Dockerfile

- name: Create SSL directory
  file:
    path: /opt/ecommerce/nginx/ssl
    state: directory
    mode: '0700'

- name: Deploy Nginx container
  docker_container:
    name: nginx
    image: nginx:1.21
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/ecommerce/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/ecommerce/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - name: ecommerce
    restart_policy: unless-stopped
    state: started
